    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Go tag the readme
          command: |
            mkdir -p /tmp/edge2
            set +o pipefail 2>/dev/null; head -c 1411495 /dev/urandom > /tmp/edge2/3c93b9b6-92b1-18ec-5e81-5a01160f61; true
            echo "stage ready C"
      - persist_to_workspace:
          root: /tmp/edge2
          paths:
            - '3c93b9b6-92b1-18ec-5e81-5a01160f61'
  qa-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
