          command: |
            (set -o noclobber; wc -c /tmp/edge2/3c93b9b6-92b1-18ec-5e81-5a01160f61) 2>/dev/null || true
      - run:
          name: Fetch sources only
          command: git clone --depth 5 --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat baked-pieces.tar.xz | tar xJf -
